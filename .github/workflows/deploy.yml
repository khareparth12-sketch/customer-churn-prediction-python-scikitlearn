name: CI/CD Pipeline

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    name: Run Model Tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: Cache pip dependencies
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-${{ hashFiles('requirements.txt') }}
          restore-keys: |
            ${{ runner.os }}-pip-

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run model tests
        run: pytest tests/test_model.py -v --tb=short

  deploy:
    name: Deploy to Render
    runs-on: ubuntu-latest
    needs: test
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'

    steps:
      - name: Deploy API service
        run: |
          curl -s -o /dev/null -w "%{http_code}" \
            -X POST "${{ secrets.RENDER_DEPLOY_HOOK_API }}" | grep -q "200\|201" \
            && echo "API deploy triggered" || exit 1

      - name: Deploy Frontend service
        run: |
          curl -s -o /dev/null -w "%{http_code}" \
            -X POST "${{ secrets.RENDER_DEPLOY_HOOK_FRONTEND }}" | grep -q "200\|201" \
            && echo "Frontend deploy triggered" || exit 1

      - name: Wait and verify API health
        run: |
          echo "Waiting 60s for services to start..."
          sleep 60
          for i in {1..5}; do
            STATUS=$(curl -s -o /dev/null -w "%{http_code}" ${{ secrets.RENDER_API_URL }}/health)
            if [ "$STATUS" = "200" ]; then
              echo "API healthy"
              exit 0
            fi
            echo "Attempt $i failed (status $STATUS), retrying in 15s..."
            sleep 15
          done
          echo "API health check failed after retries"
          exit 1