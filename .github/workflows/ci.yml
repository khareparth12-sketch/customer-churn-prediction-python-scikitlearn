name: CI → Deploy

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  # -----------------------------------------------------------------------
  # Job 1 — Run model tests
  # -----------------------------------------------------------------------
  test:
    name: Model Tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run model tests
        run: pytest tests/test_model.py -v --tb=short

  # -----------------------------------------------------------------------
  # Job 2 — Deploy to Render (only on main, only if tests pass)
  # -----------------------------------------------------------------------
  deploy:
    name: Deploy to Render
    runs-on: ubuntu-latest
    needs: test
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'

    steps:
      - name: Trigger Render deploy — API
        run: |
          curl -s -X POST "${{ secrets.RENDER_DEPLOY_HOOK_API }}" \
               -o /dev/null -w "HTTP %{http_code}\n"

      - name: Trigger Render deploy — Frontend
        run: |
          curl -s -X POST "${{ secrets.RENDER_DEPLOY_HOOK_FRONTEND }}" \
               -o /dev/null -w "HTTP %{http_code}\n"