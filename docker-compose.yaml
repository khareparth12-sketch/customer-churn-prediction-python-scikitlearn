services:
  redis:                            
    image: redis:7-alpine
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 3

  api:
    build: ./api
    restart: unless-stopped
    ports:
      - "8000:8000"
    depends_on:
      redis:                          
        condition: service_healthy

  frontend:
    build: ./dashboard
    restart: unless-stopped
    ports:
      - "10000:10000"
    depends_on:
      - api